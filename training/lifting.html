<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krafttraining Tracker</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        .exercise-card { background: #1e1e1e; padding: 20px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; }
        h3 { margin-top: 0; color: #fff; }
        .instructions { color: #aaa; font-style: italic; margin-bottom: 15px; font-size: 0.9em; }
        
        .weight-group { margin-bottom: 12px; }
        .weight-group label { display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        
        .sets-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .set-input-group { text-align: center; }
        .set-input-group label { display: block; font-size: 0.8em; color: #888; margin-bottom: 4px; }
        
        input[type="number"] { width: 100%; box-sizing: border-box; padding: 12px 5px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1.1em; text-align: center; }
        
        button { padding: 14px 20px; border: 0; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; }
        .save-btn { background: #4caf50; color: #fff; width: 100%; margin-top: 5px; }
        .reset-btn { background: #ff9800; color: #fff; width: 100%; margin-top: 20px; }
        
        .history-container { background: #252525; padding: 12px; border-radius: 8px; margin-top: 15px; }
        .history-title { font-size: 0.85em; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        
        .history-item { background: #333; padding: 10px 12px; border-radius: 6px; font-size: 0.95em; border: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .history-item.completed { border-color: #4caf50; background: #1c3320; }
        .reps-display { font-weight: bold; color: #ffeb3b; }
        .weight-badge { background: #444; padding: 2px 6px; border-radius: 4px; color: #fff; font-size: 0.85em; margin-left: 6px; }
        .date-display { color: #888; font-size: 0.85em; }
        .empty-history { color: #666; font-style: italic; font-size: 0.9em; }

        .image-container { text-align: center; margin-top: 30px; margin-bottom: 20px; }
        .image-container img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #333; }
        
        #toast { position: fixed; left: 50%; bottom: -120px; transform: translateX(-50%); background: #333; color: #fff; padding: 14px 20px; border-radius: 10px; transition: .3s; z-index: 99; border: 1px solid #555; }
        #toast.show { bottom: 20px; }
    </style>
</head>
<body>

<div id="container"></div>
<button class="reset-btn" onclick="resetAllData()">🗑 Alle Trainingsdaten löschen</button>

    <!-- Grafik für Muskelaktivierung -->
<div class="image-container">
    <img src="lifting.png" alt="Muskelaktivierungs-Karte">
</div>
            <!-- Neue Buttons unter den Reset-Button einfügen -->
    <button class="export-btn" onclick="exportData()" style="background: #2196F3; color: #fff; width: 100%; margin-top: 10px;">💾 Daten sichern (JSON)</button>
    <button class="import-btn" onclick="document.getElementById('importFile').click()" style="background: #9c27b0; color: #fff; width: 100%; margin-top: 10px;">📂 Daten laden</button>
    <input type="file" id="importFile" style="display: none" onchange="importData(event)">    
<div id="toast"></div>

<script>
    // =========================
    // ZENTRALE KONFIGURATION
    // =========================
    const CONFIG = {
        maxHistoryEntries: 5, // Anzahl letzter angezeigter Werte
        exercises: [
            { 
                id: 'benchpress',
                name: 'Benchpress (Bankdrücken)', 
                desc: 'Flach auf der Bank, Füße stabil am Boden. Auf saubere Ausführung ohne Cheater-Hohlkreuz achten.' 
            },
            { 
                id: 'rows_incline',
                name: 'Schrägbankrudern (Einarmig)', 
                desc: 'Brust liegt auf der Schrägbank auf. Entlastet L4/L5 vollständig. Ziehe die Hantel Richtung Hüfte.' 
            },
            { 
                id: 'reverse_flys_incline',
                name: 'Reverse Flys (Schrägbank)', 
                desc: 'Bauchlinks auf der Schrägbank liegen. Kurzhanteln mit leicht gebeugten Armen seitlich nach oben führen. Stärkt hintere Schulter und oberen Rücken komplett ohne LWW-Belastung.' 
            },
            { 
                id: 'flys',
                name: 'Liegende Flys', 
                desc: 'Kontrollierte Dehnung der Brust. Am tiefsten Punkt nicht federn.' 
            },
            { 
                id: 'bizeps_arnold',
                name: 'Bizepscurls in Arnold-Press', 
                desc: 'Schrägbank ~75-80°. Rumpf/L4-L5 ist komplett gestützt. Curls fließend in die Arnold-Press übergehen lassen.' 
            },
            { 
                id: 'trizeps-dowm',
                name: 'Trizeps-Drücken am Seilzug (Pushdowns)', 
                desc: 'Am Seilzug leicht nach vorne gelehnt stehen. Rumpf/L4-L5 fest anspannen, Oberarme seitlich fixieren und nur die Unterarme kontrolliert nach unten strecken.' 
            }
            // Neue Übungen einfach im gleichen Format anfügen
        ]
    };

    let resetArmed = false;

    // Helper für LocalStorage Keys
    const historyKey = id => id + "_session_history_v3";
    const weightKey = id => id + "_last_weight_v3";

    const getHistory = id => JSON.parse(localStorage.getItem(historyKey(id)) || "[]");

    function saveSession(id) {
        const weight = parseFloat(document.getElementById(`w-${id}`).value);
        const s1 = parseInt(document.getElementById(`s1-${id}`).value);
        const s2 = parseInt(document.getElementById(`s2-${id}`).value);
        const s3 = parseInt(document.getElementById(`s3-${id}`).value);

        if (isNaN(weight) || weight <= 0) {
            toast("⚠️ Bitte ein gültiges Gewicht eintragen.");
            return;
        }

        if ([s1, s2, s3].some(s => isNaN(s) || s <= 0)) {
            toast("⚠️ Bitte für alle 3 Sätze saubere Wiederholungen eintragen.");
            return;
        }

        let history = getHistory(id);
        const now = new Date();
        const dateStr = `${now.getDate()}.${now.getMonth() + 1}.`;
        
        history.push({ weight, sets: [s1, s2, s3], date: dateStr });
        
        // Dynamisch an CONFIG.maxHistoryEntries anpassen
        if (history.length > CONFIG.maxHistoryEntries) {
            history = history.slice(-CONFIG.maxHistoryEntries);
        }

        localStorage.setItem(historyKey(id), JSON.stringify(history));
        localStorage.setItem(weightKey(id), weight);
        
        // Felder leeren
        ['s1', 's2', 's3'].forEach(s => document.getElementById(`${s}-${id}`).value = "");
        
        updateHistoryUI(id);
        
        const isCompleted = [s1, s2, s3].every(val => val >= 12);
        toast(isCompleted 
            ? `🔥 <b>3x12 geschafft!</b> Nächstes Mal Gewicht erhöhen!` 
            : `✅ <b>Einheit gespeichert!</b> (${s1}/${s2}/${s3} @ ${weight}kg)`
        );
    }

    function updateHistoryUI(id) {
        const history = getHistory(id);
        const container = document.getElementById(`history-${id}`);
        
        if (history.length === 0) {
            container.innerHTML = '<span class="empty-history">Noch keine Einheiten gespeichert</span>';
            return;
        }

        container.innerHTML = history.slice().reverse().map(entry => {
            const isTargetReached = entry.sets.every(val => val >= 12);
            return `
                <div class="history-item ${isTargetReached ? 'completed' : ''}">
                    <div>
                        <span class="reps-display">${entry.sets.join(' | ')} Wdh.</span>
                        <span class="weight-badge">${entry.weight} kg</span>
                    </div>
                    <span class="date-display">${entry.date} ${isTargetReached ? '🎯' : ''}</span>
                </div>
            `;
        }).join("");
    }

    function createUI() {
        const container = document.getElementById("container");
        container.innerHTML = "";

        CONFIG.exercises.forEach(ex => {
            const lastWeight = localStorage.getItem(weightKey(ex.id)) || "";
            const card = document.createElement("div");
            card.className = "exercise-card";
            card.innerHTML = `
                <h3>${ex.name}</h3>
                <div class="instructions">${ex.desc}</div>
                
                <div class="weight-group">
                    <label>Gewicht (kg):</label>
                    <input type="number" id="w-${ex.id}" placeholder="z. B. 20" step="0.5" min="0" value="${lastWeight}" inputmode="decimal">
                </div>

                <div class="sets-grid">
                    ${[1, 2, 3].map(num => `
                        <div class="set-input-group">
                            <label>Satz ${num}</label>
                            <input type="number" id="s${num}-${ex.id}" placeholder="12" min="1" inputmode="numeric">
                        </div>
                    `).join('')}
                </div>

                <button class="save-btn" onclick="saveSession('${ex.id}')">Einheit Speichern</button>

                <div class="history-container">
                    <div class="history-title">Letzte ${CONFIG.maxHistoryEntries} Einheiten:</div>
                    <div class="history-list" id="history-${ex.id}"></div>
                </div>
            `;
            container.appendChild(card);
            updateHistoryUI(ex.id);
        });
    }

    function toast(msg) {
        const t = document.getElementById("toast");
        t.innerHTML = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2800);
    }

    function resetAllData() {
        const btn = document.querySelector('.reset-btn');
        if (!resetArmed) {
            resetArmed = true;
            btn.textContent = "⚠ Wirklich löschen? Nochmal drücken";
            setTimeout(() => { resetArmed = false; btn.textContent = "🗑 Alle Trainingsdaten löschen"; }, 4000);
            return;
        }

        CONFIG.exercises.forEach(ex => {
            localStorage.removeItem(historyKey(ex.id));
            localStorage.removeItem(weightKey(ex.id));
        });

        createUI();
        resetArmed = false;
        btn.textContent = "🗑 Alle Trainingsdaten löschen";
        toast("🗑 Daten zurückgesetzt");
    }

    createUI();

    function exportData() {
        const data = {};
        CONFIG.exercises.forEach(ex => {
            data[historyKey(ex.id)] = localStorage.getItem(historyKey(ex.id));
            data[weightKey(ex.id)] = localStorage.getItem(weightKey(ex.id));
        });
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `trainingsdaten_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        toast("💾 Backup erfolgreich heruntergeladen!");
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                Object.keys(data).forEach(key => {
                    if (data[key] !== null) {
                        localStorage.setItem(key, data[key]);
                    }
                });
                createUI();
                toast("✅ Daten erfolgreich wiederhergestellt!");
            } catch (err) {
                toast("⚠️ Fehler beim Lesen der Backup-Datei.");
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
